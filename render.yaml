previews:
  generation: automatic

services:
  # Backend API
  - type: web
    runtime: docker
    name: ml-task-scheduler-backend
    region: oregon
    plan: free
    repo: https://github.com/shri33/ML-Task-Scheduler
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://ml-task-scheduler.vercel.app
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

  # ML Service
  - type: worker
    runtime: docker
    name: ml-task-scheduler-ml
    region: oregon
    plan: starter
    repo: https://github.com/shri33/ML-Task-Scheduler
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service

databases:
  # PostgreSQL Database
  - name: postgres
    plan: free
    region: oregon
    ipAllowList: []

  # Redis Cache & Queue Store
  - name: redis
    plan: free
    region: oregon
    ipAllowList: []
